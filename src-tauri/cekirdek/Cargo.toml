[package]
name = "cekirdek"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zsen Clock uygulamasinin platformdan bagimsiz cekirdegi"

# Tauri'ye bagimli degil: boylece testler herhangi bir platformda (ornegin
# derleme container'inda, Linux uzerinde) dogrudan kosturulabiliyor.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
